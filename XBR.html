<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Of BR & DR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body, html { width:100%; height:100%; font-family:Arial,sans-serif; background:#f4f4f9; overflow:hidden; }
  .container { width:100%; height:100%; display:flex; flex-direction:column; }
  .header { background:#009879; color:#fff; padding:12px; text-align:center; font-size:1.2rem; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,.1); }
  .updbar { background:#fff8e1; color:#5d4037; padding:8px 12px; text-align:center; font-size:.95rem; border-bottom:1px solid #ffe082; display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:#e53935; animation:pulse 1.2s infinite; }
  .badge { background:#e53935; color:#fff; font-size:.7rem; padding:2px 7px; border-radius:10px; font-weight:bold; animation:blink 1s infinite; display:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(229,57,53,.7)} 70%{box-shadow:0 0 0 10px rgba(229,57,53,0)} 100%{box-shadow:0 0 0 0 rgba(229,57,53,0)} }
  @keyframes blink { 50% { opacity:.4; } }
  iframe { width:100%; flex:1; border:none; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:99; }
  .modal { background:#fff; border-radius:16px; padding:24px 20px; width:88%; max-width:340px; text-align:center; animation:pop .4s ease; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .modal .icon { font-size:48px; }
  .modal h2 { color:#009879; margin:8px 0; }
  .modal .day { font-size:1.4rem; font-weight:bold; margin-top:6px; }
  .modal .date { font-size:1.1rem; color:#333; }
  .modal .ago { color:#777; font-size:.9rem; margin:6px 0 14px; }
  .modal button { background:#009879; color:#fff; border:none; padding:10px 28px; border-radius:25px; font-size:1rem; cursor:pointer; }
  @keyframes pop { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }
</style>
</head>
<body>
<div class="container">
  <div class="header">Data Of BR & DR</div>

  <div class="updbar">
    <span class="dot"></span>
    <span id="updText">Last update check ho raha hai...</span>
    <span class="badge" id="newBadge">NEW</span>
  </div>

  <iframe id="sheet" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTzrbFmAKogTY3zo4mYbFokLPFGGsJ5dTJgvvITbSamdEcQUDPL8w7b62WPvw4Shsco75BbIYaz4dN_/pubhtml?widget=true&amp;headers=false"></iframe>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="icon">🔔</div>
    <h2>Data Update Hua!</h2>
    <div class="day" id="mDay"></div>
    <div class="date" id="mDate"></div>
    <div class="ago" id="mAgo"></div>
    <button onclick="closePopup()">ठीक है</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxu4opom6ytmbWimb8nbj6sZYxEbngIMmDMSfVeDqR1s8qY1NsItr5giFekecPgETjQ/exec";
let lastKnown = null;

function fmt(d) {
  const tz = { timeZone: "Asia/Kolkata" };
  return {
    day:  d.toLocaleDateString("hi-IN", { ...tz, weekday: "long" }),
    date: d.toLocaleDateString("hi-IN", { ...tz, day: "numeric", month: "long", year: "numeric" }),
    time: d.toLocaleTimeString("en-IN", { ...tz, hour: "2-digit", minute: "2-digit", hour12: true })
  };
}

function ago(d) {
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1) return "अभी-अभी";
  if (m < 60) return m + " मिनट पहले";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " घंटे पहले";
  return Math.floor(h / 24) + " दिन पहले";
}

function closePopup() { document.getElementById("overlay").style.display = "none"; }

async function check() {
  try {
    const r = await fetch(API, { cache: "no-store" });
    const j = await r.json();
    const d = new Date(j.updated);
    const f = fmt(d);

    document.getElementById("updText").textContent =
      "Last Update: " + f.day + ", " + f.date + " • " + f.time + " (" + ago(d) + ")";

    document.getElementById("newBadge").style.display =
      (Date.now() - d) < 86400000 ? "inline-block" : "none";

    let seen = null;
    try { seen = localStorage.getItem("lastSeenUpdate"); } catch(e) {}
    if (seen !== j.updated) {
      document.getElementById("mDay").textContent  = f.day;
      document.getElementById("mDate").textContent = f.date + " • " + f.time;
      document.getElementById("mAgo").textContent  = ago(d);
      document.getElementById("overlay").style.display = "flex";
      try { localStorage.setItem("lastSeenUpdate", j.updated); } catch(e) {}
    }

    if (lastKnown && lastKnown !== j.updated) {
      const fr = document.getElementById("sheet");
      fr.src = fr.src;
    }
    lastKnown = j.updated;
  } catch (e) {
    document.getElementById("updText").textContent = "Last update info load nahi hui";
  }
}

check();
setInterval(check, 60000);
</script>
</body>
</html>
